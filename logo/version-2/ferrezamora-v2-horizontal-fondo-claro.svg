<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="1480" height="400">
  <title>FerreZamora v2, logo horizontal para fondo claro</title>
  <defs>
    <path id="L-F" d="M0 0h60v20H20v20h30v20H20v40H0z"/>
    <path id="L-E" d="M0 0h60v20H20v20h28v20H20v20h40v20H0z"/>
    <path id="L-R" fill-rule="evenodd" d="M0 0H60V60H46L62 100H40L26 60H20V100H0ZM20 20V40H40V20Z"/>
    <path id="L-Z" d="M0 0h60v20L24 80h36v20H0V80L36 20H0z"/>
    <path id="L-A" fill-rule="evenodd" d="M0 18L18 0H42L60 18V100H40V68H20V100H0ZM20 24V48H40V24Z"/>
    <path id="L-M" d="M0 0h80v100H60V20H50v50H30V20H20v80H0z"/>
    <path id="L-O" fill-rule="evenodd" d="M0 0H60V100H0ZM20 20V80H40V20Z"/></defs>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/><stop offset=".55" stop-color="#b8c1cc"/><stop offset="1" stop-color="#7b8796"/>
    </linearGradient>
    <linearGradient id="steel-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c9d0d9"/><stop offset="1" stop-color="#8c97a5"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#46e3ff"/><stop offset=".55" stop-color="#17b2ef"/><stop offset="1" stop-color="#0a6fd1"/>
    </linearGradient>
    <mask id="jaw" maskUnits="userSpaceOnUse" x="-130" y="-50" width="260" height="100">
      <rect x="-130" y="-50" width="260" height="100" fill="#fff"/>
      <rect x="-114" y="-8" width="27" height="16" fill="#000"/>
    </mask>
  </defs>

  <!-- llave (arriba izquierda → abajo derecha) -->
  <g transform="translate(100 100) rotate(45)">
    <g mask="url(#jaw)" fill="url(#steel)">
      <rect x="-72" y="-8.5" width="146" height="17" rx="8.5"/>
      <circle cx="-86" cy="0" r="22"/>
      <path fill-rule="evenodd" d="M68 0a17 17 0 1 0 34 0a17 17 0 1 0-34 0ZM78 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0Z"/>
    </g>
  </g>

  <!-- martillo (cabeza arriba derecha, mango abajo izquierda) -->
  <g transform="translate(100 100) rotate(-45)" fill="url(#steel)">
    <rect x="-100" y="-7.5" width="176" height="15" rx="7.5"/>
    <rect x="-100" y="-8.5" width="34" height="17" rx="8.5" fill="#5c6878"/>
    <!-- cabeza: cuerpo, cara de golpe y uña curva -->
    <rect x="64" y="-30" width="22" height="46" rx="3"/>
    <rect x="61" y="-42" width="28" height="14" rx="2.5"/>
    <path d="M64 14H86C86 30 80 44 64 54C70 42 70 28 64 20Z"/>
  </g>

  <!-- rombo plateado -->
  <rect x="49" y="49" width="102" height="102" rx="16" transform="rotate(45 100 100)" fill="#0b1a33" stroke="url(#steel-ring)" stroke-width="11"/>
  <rect x="49" y="49" width="102" height="102" rx="16" transform="rotate(45 100 100)" fill="none" stroke="#0b1a33" stroke-opacity=".35" stroke-width="1.5"/>

  <!-- F azul con volumen -->
  <g transform="translate(76 69)">
    <path d="M0 0H40L48 8V18H17V27H40V43H17V62H0Z" fill="#0a4590" transform="translate(3.5 3.5)"/>
    <path d="M0 0H40L48 8V18H17V27H40V43H17V62H0Z" fill="url(#cyan)"/>
    <path d="M0 0H40L48 8V10H8V62H0Z" fill="#ffffff" opacity=".18"/>
  </g>
  <g transform="translate(218 58) scale(.64)">
    <g fill="#0b1a33">
      <use href="#L-F" x="0"/><use href="#L-E" x="70"/><use href="#L-R" x="140"/><use href="#L-R" x="214"/><use href="#L-E" x="288"/>
      <use href="#L-Z" x="358"/><use href="#L-A" x="428"/><use href="#L-M" x="498"/><use href="#L-O" x="588"/><use href="#L-R" x="658"/><use href="#L-A" x="730"/>
    </g>
  </g>
  <rect x="218" y="134" width="40" height="4" rx="2" fill="#0a6fd1"/>
  <text x="268" y="141" text-anchor="start" fill="#0a6fd1" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="4.8">FERRETERÍA · HERRAMIENTAS</text>
</svg>
